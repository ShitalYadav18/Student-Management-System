services:
  web:
    build: .
    image: student-management-web:latest
    container_name: student_web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-studentuser}
      DB_PASSWORD: ${DB_PASSWORD:-studentpass}
      DB_NAME: ${DB_NAME:-studentdb}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: student_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-studentdb}
      MYSQL_USER: ${DB_USER:-studentuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-studentpass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
